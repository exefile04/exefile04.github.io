<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0614'/%3E%3Ctext x='32' y='47' font-family='Arial,Helvetica,sans-serif' font-size='46' font-weight='700' text-anchor='middle' fill='%23d8b4fe'%3Ee%3C/text%3E%3C/svg%3E">
  <style>
    @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

    :root { --bg-color: #05030a; --text-main: #f3e8ff; --purple: 168, 85, 247; }

    * { box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-color); color: var(--text-main);
      min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: center;
      overflow: hidden; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }

    #bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

    /* ---------- Card (compact) ---------- */
    .card {
      position: relative; z-index: 10; will-change: transform; min-width: min(280px, calc(100vw - 32px));
      --mx: 50%; --my: 50%; touch-action: none;
      padding: .8rem 1.3rem;
      border: 1px solid rgba(var(--purple), 0.12);
      border-radius: 16px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: border-color .6s ease, box-shadow .6s ease, transform .2s ease-out,
                  padding 1.1s cubic-bezier(.22,1,.36,1), width 1.1s cubic-bezier(.22,1,.36,1);
      animation: rise 1.4s cubic-bezier(.16,1,.3,1) backwards;
    }
    .card.lit { border-color: rgba(var(--purple), 0.12); }
    .card.flash { box-shadow: 0 0 30px rgba(var(--purple), 0.04); }
    .card.revealed { padding: .8rem 1.3rem .8rem; border-color: rgba(var(--purple), 0.06); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(12px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    /* Light travelling around the border once opened */
    .card::after {
      content: ""; position: absolute; inset: -1px; padding: 1px; border-radius: inherit; pointer-events: none;
      background: conic-gradient(from var(--ang), transparent 0 58%, rgba(216,180,254,.8) 80%, transparent 92% 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity 1s ease; animation: spin 5s linear infinite;
    }
    .card.revealed::after { opacity: 1; }
    @keyframes spin { to { --ang: 360deg; } }

    /* Spotlight lives INSIDE the box only (it is the box's own size + rounded corners, so nothing leaks out) */
    .glow {
      position: absolute; inset: 0; z-index: -1; pointer-events: none; border-radius: inherit;
      background: radial-gradient(200px circle at var(--mx) var(--my),
        rgba(216,180,254,.06) 0%, rgba(var(--purple), .025) 50%, transparent 78%);
      opacity: 0; transition: opacity .35s ease;
    }
    .card.lit .glow { opacity: 1; }

    /* Edge light that follows the cursor along the border */
    .card::before {
      content: ""; position: absolute; inset: -1px; padding: 1px; border-radius: inherit; pointer-events: none;
      background: radial-gradient(160px circle at var(--mx) var(--my),
        rgba(233,213,255,.34) 0%, rgba(var(--purple), .12) 45%, transparent 78%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity .35s ease;
    }
    .card.lit::before { opacity: 1; }

    /* ---------- Header: photo + name ---------- */
    .head { display: flex; align-items: center; justify-content: center; gap: .8rem; cursor: pointer; }

    .avatar { position: relative; width: 52px; height: 52px; flex: none;
      transition: transform .8s cubic-bezier(.2,1.2,.3,1); }
    .avatar img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(var(--purple), .35); }
    .avatar::before { /* spinning ring while open */
      content: ""; position: absolute; inset: -4px; padding: 1.5px; border-radius: 50%; pointer-events: none;
      background: conic-gradient(from var(--ang), transparent 0 55%, rgba(216,180,254,.9) 85%, transparent 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity .8s ease; animation: spin 3.5s linear infinite;
    }
    .card.revealed .avatar { transform: scale(1.1); }
    .card.revealed .avatar::before { opacity: 1; }
    .head:hover .avatar { transform: scale(1.08); }
    .card.revealed .head:hover .avatar { transform: scale(1.18); }

    h1 {
      font-size: .95rem; font-weight: 500; letter-spacing: .3em; margin-right: -.3em;
      text-transform: lowercase; color: var(--text-main);
      text-shadow: 0 0 14px rgba(var(--purple), .2);
      transition: text-shadow .6s ease; white-space: nowrap;
    }
    h1 span { display: inline-block; }
    .card.lit h1 { text-shadow: 0 0 16px rgba(216,180,254,.18); }
    h1.wave span { animation: hop .9s cubic-bezier(.3,1.4,.5,1) both; animation-delay: calc(var(--i) * 50ms); }
    @keyframes hop { 35% { transform: translateY(-7px); } 100% { transform: none; } }

    /* ---------- Reach-out panel: old Telegram box + projects ---------- */
    .reveal { display: grid; grid-template-rows: 0fr; width: 0; min-width: 100%;
      transition: grid-template-rows 1.1s cubic-bezier(.22,1,.36,1); }
    .card.revealed .reveal { grid-template-rows: 1fr; }
    .reveal > div { clip-path: inset(0 -24px 0 -24px); min-height: 0; } /* clips top/bottom only, so hover lift + glow can breathe sideways */
    .reveal-inner { text-align: center; padding: 6px 0 14px; width: min(352px, calc(100vw - 64px)); position: relative; left: 50%; transform: translateX(-50%); }
    .reveal-inner > * { opacity: 0; transform: translateY(10px) scale(.94); filter: blur(6px);
      transition: opacity .6s ease, transform .8s cubic-bezier(.2,1.2,.3,1), filter .6s ease; }
    .card.revealed .reveal-inner > * { opacity: 1; transform: none; filter: blur(0);
      transition-delay: calc(.4s + var(--d) * .12s); }

    .links { display: flex; justify-content: center; align-items: flex-start; flex-wrap: wrap; gap: .4rem 1.1rem; }
    .links .col { display: flex; flex-direction: column; align-items: center; }
    .tg-label { margin-top: .5rem; font-size: .68rem; letter-spacing: .18em; color: rgba(209,213,219,.5); }
    .item { margin-top: .6rem; max-width: 100%; }
    .item + .tg-label { margin-top: 1rem; }
    .credit { margin-top: .9rem; font-size: .62rem; letter-spacing: .1em; color: rgba(209,213,219,.38); }
    .credit a, .credit a:visited { color: rgba(216,180,254,.6); text-decoration: none; }
    .credit a:hover, .credit a:focus-visible { color: rgba(233,213,255,.95); }

    /* No underline and no color change on hover/focus/visited/active */
    a.pill, a.pill:hover, a.pill:focus, a.pill:visited, a.pill:active { color: var(--text-main); text-decoration: none; outline: none; }
    a.pill {
      position: relative; isolation: isolate; overflow: hidden; white-space: nowrap;
      display: inline-flex; align-items: center; gap: .65rem; max-width: 100%;
      padding: .55rem 1.1rem;
      border: 1px solid rgba(var(--purple), .3); border-radius: 999px;
      background-color: rgba(var(--purple), .07);
      font-size: 1rem; letter-spacing: .06em; cursor: pointer;
      transition: transform .35s cubic-bezier(.2,1.3,.3,1), border-color .3s ease,
                  background-color .3s ease, box-shadow .35s ease;
    }
    a.pill.small { font-size: .85rem; letter-spacing: .04em; padding: .5rem 1rem; }
    a.pill span { overflow: hidden; text-overflow: ellipsis; }
    a.pill svg { width: 20px; height: 20px; flex: none; }
    a.pill .tgi { fill: #a855f7; transition: transform .5s cubic-bezier(.2,1.5,.3,1), filter .3s ease; }
    a.pill .go { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      opacity: .5; transition: transform .35s cubic-bezier(.2,1.5,.3,1), opacity .3s ease; }

    /* cursor spotlight inside the button */
    a.pill::before {
      content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
      background: radial-gradient(90px circle at var(--px, 50%) var(--py, 50%), rgba(216,180,254,.38), transparent 72%);
      opacity: 0; transition: opacity .3s ease;
    }
    /* shine sweep: driven by transition so it plays on hover and (via .shine) once on reveal */
    a.pill::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
      transform: skewX(-20deg); transition: none;
    }
    a.pill:hover::after, a.pill:focus-visible::after, a.pill.shine::after { left: 130%; transition: left .8s ease; }

    a.pill:hover, a.pill:focus-visible {
      transform: translateY(-2px) scale(1.03);
      border-color: rgba(216,180,254,.65); background-color: rgba(var(--purple), .16);
      box-shadow: 0 4px 16px rgba(var(--purple), .3), inset 0 0 14px rgba(216,180,254,.08);
    }
    a.pill:hover::before, a.pill:focus-visible::before { opacity: 1; }
    a.pill:hover .tgi, a.pill:focus-visible .tgi { transform: translate(2px,-2px) rotate(-14deg) scale(1.15); filter: drop-shadow(0 0 5px rgba(216,180,254,.7)); }
    a.pill:hover .go, a.pill:focus-visible .go { transform: translate(3px,-3px); opacity: 1; }
    a.pill:active { transform: translateY(0) scale(.96); box-shadow: 0 1px 6px rgba(var(--purple), .25); transition-duration: .1s; }

    #gate {
      position: fixed; inset: 0; z-index: 50; cursor: pointer;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      background: rgba(5,3,10,.35);
      transition: opacity .9s ease, backdrop-filter .9s ease, -webkit-backdrop-filter .9s ease;
    }
    #gate.gone { opacity: 0; pointer-events: none; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
    .audio-notice {
      position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 100;
      font-size: .75rem; letter-spacing: .08em; text-transform: lowercase;
      color: rgba(156,163,175,.4); pointer-events: none; transition: opacity .5s ease;
    }

    /* ---------- Player inside the card ---------- */
    .mpwrap { margin-top: .7rem; display: flex; justify-content: center; }
    .mp { display: inline-flex; align-items: center; max-width: 100%; padding: 4px;
      border: 1px solid rgba(var(--purple), .12); border-radius: 999px; background: rgba(10,6,20,.45);
      transition: border-color .8s ease, background-color .8s ease; }
    .mpwrap.open .mp { border-color: rgba(var(--purple), .2); background: rgba(14,9,28,.6); }
    .mp button { border: 0; background: transparent; color: rgba(243,232,255,.72); cursor: pointer; outline: none;
      display: grid; place-items: center; flex: none; border-radius: 50%;
      transition: transform .25s cubic-bezier(.2,1.5,.3,1), background-color .2s ease, color .2s ease; }
    .mp button:hover, .mp button:focus-visible { background: rgba(var(--purple), .16); color: #fff; transform: scale(1.08); }
    .mp button:active { transform: scale(.92); transition-duration: .08s; }
    .mp .pb { width: 26px; height: 26px; }
    .mp .pb svg { width: 13px; height: 13px; fill: currentColor; stroke: none; }
    .mp .pplay { position: relative; width: 40px; height: 40px; }
    .mp .pplay svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); fill: none; }
    .ring circle { fill: none; stroke-width: 2; }
    .ring .rt { stroke: rgba(var(--purple), .2); }
    .ring .rp { stroke: rgba(216,180,254,.9); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .3s linear; }
    .mp.loading .ring .rp { stroke-dasharray: 22 78; stroke-dashoffset: 0; transition: none;
      animation: ringspin .9s linear infinite; transform-origin: 22px 22px; }
    @keyframes ringspin { to { transform: rotate(360deg); } }
    .mp .pplay .ic { position: relative; width: 14px; height: 14px; fill: currentColor; stroke: none; }
    .mp .i-pause { display: none; }
    .mp.playing .i-play { display: none; } .mp.playing .i-pause { display: block; }
    .mp .i-x { display: none; } .mp.muted .i-x { display: block; } .mp.muted .i-waves { display: none; }
    .mp .i-waves, .mp .i-x { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .pextra { display: flex; align-items: center; max-width: 0; opacity: 0; overflow: hidden;
      transition: max-width 1.5s cubic-bezier(.22,1,.36,1), opacity 1s ease .2s; }
    .mpwrap.open .pextra { max-width: 270px; opacity: 1; }
    .pmeta { display: flex; flex-direction: column; width: 140px; flex: none; padding: 0 .55rem 0 .3rem; text-align: left; line-height: 1.25; }
    .ptitle, .partist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: lowercase; }
    .ptitle { font-size: .76rem; letter-spacing: .05em; color: rgba(243,232,255,.92); }
    .partist { font-size: .62rem; letter-spacing: .05em; color: rgba(209,213,219,.45); }
    .partist:empty { display: none; }

    @media (max-width: 420px) {
      .card { padding: .75rem 1rem; } .card.revealed { padding: .75rem 1rem .75rem; }
      .head { gap: .65rem; } h1 { font-size: .88rem; }
      a.pill.small { font-size: .78rem; padding: .45rem .85rem; }
    }
    @media (max-height: 380px) {
      .item + .tg-label { margin-top: .6rem; }
      .item { margin-top: .4rem; }
      a.pill { padding: .4rem .9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .card::after, .avatar::before, h1.wave span { animation: none; }
      a.pill, a.pill *, .mp button, .mp { transition: none !important; }
    }
  </style>
</head>

    };
    card.addEventListener('pointerenter', e => { toCard(e); card.classList.add('lit'); });
    card.addEventListener('pointerdown', e => { toCard(e); card.classList.add('lit'); });
    card.addEventListener('pointermove', e => {
      toCard(e); card.classList.add('lit');
      if (!reduce && e.pointerType === 'mouse') {
        const r = card.getBoundingClientRect();
        const dx = (e.clientX - r.left) / r.width - 0.5, dy = (e.clientY - r.top) / r.height - 0.5;
        card.style.transform = `perspective(700px) rotateY(${dx * 5}deg) rotateX(${-dy * 5}deg)`;
      }
    });
    card.addEventListener('pointerleave', () => { card.classList.remove('lit'); card.style.transform = ''; });
    card.addEventListener('pointercancel', () => { card.classList.remove('lit'); card.style.transform = ''; });
    card.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') card.classList.remove('lit'); });

    /* Buttons: spotlight follows the pointer inside each pill, and the shine plays once on reveal */
    const pills = [...document.querySelectorAll('a.pill')];
    pills.forEach(p => p.addEventListener('pointermove', e => {
      const r = p.getBoundingClientRect();
      p.style.setProperty('--px', (e.clientX - r.left) + 'px');
      p.style.setProperty('--py', (e.clientY - r.top) + 'px');
    }));
    const shine = p => { p.classList.add('shine'); setTimeout(() => p.classList.remove('shine'), 900); };

    /* Letters hop when you hover the name */
    let waving = false;
    head.addEventListener('pointerenter', e => {
      if (e.pointerType !== 'mouse' || waving || reduce) return;
      waving = true; waveLetters(); setTimeout(() => waving = false, 1000);
    });

    /* Split the name into letters so they can ripple */
    titleBtn.innerHTML = [...titleBtn.textContent].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('');
    function waveLetters() {
      titleBtn.classList.remove('wave'); void titleBtn.offsetWidth; titleBtn.classList.add('wave');
    }

    /* ---------- Effects ---------- */
    function ripple(delay = 0, strength = 1) {
      setTimeout(() => {
        const c = titleCenter();
        ripples.push({ x: c.x, y: c.y, r: 6, a: strength });
      }, delay);
    }

    function pulse() {
      ripple();
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 700);
    }

    function burst() {
      const c = titleCenter();
      for (let i = 0; i < 24; i++) {
        const a = Math.random() * 6.28, sp = Math.random() * 3.5 + 1;
        sparks.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1,
          shape: SHAPES[(Math.random() * SHAPES.length) | 0], rot: Math.random() * 6.28,
          decay: Math.random() * 0.01 + 0.007, size: Math.random() * 1.4 + 0.5,
          color: Math.random() > 0.4 ? '216,180,254' : '255,255,255' });
      }
      ripple(0, 1); ripple(180, 0.8); ripple(380, 0.6);
    }

    const glyphs = '!<>-_\\/[]{}=+*^?#01';
    function scramble(el, text, duration = 1000) {
      const start = performance.now();
      (function frame(now) {
        const p = Math.min((now - start) / duration, 1), fixed = Math.floor(p * text.length);
        el.textContent = text.split('').map((ch, i) => (i < fixed || ch === '@') ? ch : pick(glyphs)).join('');
        if (p < 1) requestAnimationFrame(frame); else el.textContent = text;
      })(start);
    }

    /* ---------- Double click on the name ---------- */
    let clicks = 0, clickTimer;
    let collapsedW = 0;
    function toggleReveal() {
      revealed = !revealed;
      const from = card.offsetWidth;                 // animate the width so the box grows/shrinks smoothly
      if (revealed) collapsedW = from;
      card.style.width = from + 'px'; void card.offsetWidth;
      card.style.width = (revealed ? Math.min(400, innerWidth - 32) : collapsedW) + 'px';
      if (!revealed) setTimeout(() => { if (!revealed) card.style.width = ''; }, 1200);
      card.classList.toggle('revealed', revealed);
      if (revealed) { waveLetters(); burst(); scramble(tgText, '@exefile04'); scramble(ghText, 'exefile04'); notice.style.opacity = '0';
        pills.forEach((p, i) => setTimeout(() => { if (revealed) shine(p); }, 1100 + i * 400)); }
      else { ripple(); notice.style.opacity = '1'; }
    }
    head.addEventListener('click', e => {
      e.stopPropagation();
      pulse();
      clicks++;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => clicks = 0, 420);
      if (clicks >= 2) { clicks = 0; toggleReveal(); }
    });
    addEventListener('keydown', e => { if (e.key === 'Escape' && revealed) toggleReveal(); });

    /* ---------- Animation loop ---------- */
    let last = performance.now(), nextSpawn = 0;
    function animate(now) {
      const dt = Math.min(now - last, 50); last = now;
      const f = dt / 16.667;
      ctx.fillStyle = '#05030a';
      ctx.fillRect(0, 0, W, H);

      waveOffset += 0.008 * f;
      if (touchHideAt && now > touchHideAt) { mouse.on = false; touchHideAt = 0; }
      if (mouse.on) {
        if (presence < 0.02) { smooth.x = mouse.x; smooth.y = mouse.y; }
        else { const k = 1 - Math.exp(-dt / 110); smooth.x += (mouse.x - smooth.x) * k; smooth.y += (mouse.y - smooth.y) * k; }
      }
      presence += ((mouse.on ? 1 : 0) - presence) * (1 - Math.exp(-dt / (mouse.on ? 160 : 420)));

      // Weaving lines: faint, with a soft purple wash that follows the cursor
      const wave = new Path2D();
      for (let i = 0; i < 12; i++) {
        const rowY = (H / 12) * i;
        for (let x = 0; x <= W; x += 20) {
          const wy = rowY + Math.sin(x * 0.005 + waveOffset + i) * 25;
          x === 0 ? wave.moveTo(x, wy) : wave.lineTo(x, wy);
        }
      }
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(156,163,175,0.05)'; ctx.stroke(wave);
      if (presence > 0.01) {
        const gr = ctx.createRadialGradient(smooth.x, smooth.y, 0, smooth.x, smooth.y, GLOW_R);
        gr.addColorStop(0, `rgba(196,150,250,${(0.12 * presence).toFixed(3)})`);
        gr.addColorStop(1, 'rgba(196,150,250,0)');
        ctx.strokeStyle = gr; ctx.stroke(wave);
      }

      // Ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 7 * f; rp.a *= Math.pow(0.985, f);
        ctx.strokeStyle = `rgba(192,132,252,${rp.a * 0.07})`; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, 6.2832); ctx.stroke();
        ctx.strokeStyle = `rgba(216,180,254,${rp.a * 0.22})`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, 6.2832); ctx.stroke();
        if (rp.a < 0.05 || rp.r > Math.max(W, H)) ripples.splice(i, 1);
      }

      // Flying lines
      flyingLines.forEach(l => {
        l.x += l.speed * f;
        if (l.x - l.length > W) { l.x = -l.length; l.y = Math.random() * H; }
        const lb = near(clamp(smooth.x, l.x - l.length, l.x), l.y);
        ctx.strokeStyle = `rgba(${l.color},${(0.12 + lb * 0.14).toFixed(3)})`; ctx.lineWidth = l.width;
        ctx.beginPath(); ctx.moveTo(l.x - l.length, l.y); ctx.lineTo(l.x, l.y); ctx.stroke();
      });

      // Shooting stars (rare)
      if (!reduce && (nextShooter -= f) <= 0) {
        nextShooter = 400 + Math.random() * 400;
        shooters.push({ x: Math.random() * W * 0.8, y: -20, vx: 6 + Math.random() * 3, vy: 3 + Math.random() * 2, life: 1 });
      }
      for (let i = shooters.length - 1; i >= 0; i--) {
        const s = shooters[i];
        s.x += s.vx * f; s.y += s.vy * f; s.life -= 0.012 * f;
        const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 14, s.y - s.vy * 14);
        g.addColorStop(0, `rgba(233,213,255,${s.life * 0.5})`); g.addColorStop(1, 'rgba(168,85,247,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 14, s.y - s.vy * 14); ctx.stroke();
        if (s.life <= 0 || s.y > H) shooters.splice(i, 1);
      }

      // Dots
      snowDots.forEach(d => {
        d.x += d.vx * f; d.y += d.vy * f; d.tw += d.tws * f;
        if (d.y > H) d.y = 0; if (d.y < 0) d.y = H;
        if (d.x > W) d.x = 0; if (d.x < 0) d.x = W;
        d.rot += d.rs * f;
        const db = near(d.x, d.y);
        ctx.fillStyle = `rgba(${d.color},${(0.14 + Math.sin(d.tw) * 0.08 + db * 0.16).toFixed(3)})`;
        drawShape(d.shape, d.x, d.y, d.size * 1.7 * (1 + db * 0.25), d.rot, 0, 0, 1);
      });

      // Sparks from the reveal
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.x += p.vx * f; p.y += p.vy * f; p.vx *= Math.pow(0.97, f); p.vy *= Math.pow(0.97, f); p.life -= p.decay * f;
        ctx.fillStyle = `rgba(${p.color},${Math.max(p.life, 0) * 0.6})`;
        p.rot += 0.08 * f;
        drawShape(p.shape, p.x, p.y, p.size * 1.9, p.rot, 0, 0, 1);
        if (p.life <= 0) sparks.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
